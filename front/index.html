<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIAF - Planificación Académica</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary-color: #1a3a5a;
            --accent-color: #00c2cb;
            --bg-light: #f4f7f9;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        /* Navbar con gradiente oscuro y borde inferior teal */
        .navbar-custom {
            background: linear-gradient(90deg, var(--primary-color) 0%, #2c5282 100%);
            border-bottom: 3px solid var(--accent-color);
            padding: 10px 24px;
        }

        .navbar-custom .brand-text {
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-custom .brand-text i {
            font-size: 1.3rem;
        }

        .navbar-custom .user-area {
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .navbar-custom .user-area .fw-bold {
            font-weight: 700;
        }

        .btn-salir {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            color: #fff;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn-salir:hover {
            background: rgba(255,255,255,0.15);
            border-color: #fff;
            color: #fff;
        }

        /* Sidebar */
        .sidebar-card {
            background: #fff;
            border-radius: 10px;
            border: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            padding: 20px 16px;
        }

        .sidebar-card .menu-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .sidebar-card .list-group-item {
            border: none;
            margin-bottom: 2px;
            border-radius: 8px;
            transition: all 0.25s;
            font-weight: 500;
            font-size: 0.88rem;
            padding: 9px 14px;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2d3748;
        }

        .sidebar-card .list-group-item:hover {
            background-color: #edf2f7;
            transform: translateX(4px);
        }

        .sidebar-card .list-group-item.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        .sidebar-card .list-group-item.active i {
            color: #fff !important;
        }

        .sidebar-card .sidebar-footer {
            font-size: 11px;
            color: #a0aec0;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
            margin-top: 16px;
        }

        .sidebar-card .sidebar-footer i {
            font-size: 11px;
        }

        /* Colores de iconos del menú */
        .icon-crear { color: #3182ce; }
        .icon-editar { color: #d69e2e; }
        .icon-borrar { color: #e53e3e; }
        .icon-listar { color: #00c2cb; }

        /* Panel principal */
        .main-panel {
            background: #fff;
            border-radius: 10px;
            border: none;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            padding: 32px;
            min-height: 480px;
        }

        /* Vista de bienvenida */
        .welcome-title {
            font-size: 1.65rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            color: #a0aec0;
            font-size: 1rem;
        }

        /* Formularios */
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #718096;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(0,194,203,0.15);
        }

        /* Tabla */
        .table thead th {
            font-size: 0.78rem;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* Alertas */
        .alert {
            border-radius: 8px;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <noscript>
        <div style="text-align: center; margin-top: 50px; color: red; font-weight: bold;">
            Este aplicativo requiere JavaScript habilitado.
        </div>
    </noscript>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    
    <script src="/app.js"></script>
</body>
</html>
